<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | VAPE LAB</title>
    <style>
        :root {
            --bg-base: #08070b;
            --card-bg: #121019;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --text-main: #ffffff;
            --text-muted: #a09ab0;
            --border-glow: rgba(0, 240, 255, 0.3);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .btn-volver {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
        }

        .btn-volver:hover {
            background: var(--neon-cyan);
            color: #000;
        }

        /* Formulario */
        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-card h3 {
            margin-top: 0;
            color: var(--neon-cyan);
            font-size: 18px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input, textarea {
            width: 100%;
            padding: 10px 15px;
            background: #08070b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-cyan);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--neon-cyan), #0088ff);
            color: #000;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            flex-grow: 1;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }

        .btn-cancel.show {
            display: block;
        }

        /* Listado de Productos en Admin */
        .admin-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .admin-item {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-item-info img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
        }

        .admin-item-details h4 {
            margin: 0 0 5px 0;
            font-size: 15px;
        }

        .admin-item-details span {
            color: var(--neon-cyan);
            font-size: 13px;
            font-weight: bold;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
        }

        .btn-edit {
            background: rgba(255, 170, 0, 0.2);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .btn-edit:hover {
            background: #ffaa00;
            color: #000;
        }

        .btn-delete {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .btn-delete:hover {
            background: #ff4444;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Panel de Administración</h1>
            <a href="/" class="btn-volver">Ver Tienda ➔</a>
        </header>

        <!-- Formulario de Producto -->
        <div class="form-card">
            <h3 id="form-title">Agregar Nuevo Producto</h3>
            <form id="product-form" onsubmit="guardarProducto(event)">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label>Nombre del producto</label>
                    <input type="text" id="nombre" required placeholder="Ej. Elf Bar BC5000">
                </div>
                <div class="form-group">
                    <label>Precio (Bs)</label>
                    <input type="number" step="0.01" id="precio" required placeholder="120.00">
                </div>
                <div class="form-group">
                    <label>URL de la imagen</label>
                    <input type="text" id="imagen" required placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="descripcion" rows="3" required placeholder="Detalles del producto..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-submit" id="btn-submit-text">Guardar Producto</button>
                    <button type="button" class="btn-cancel" id="btn-cancel" onclick="limpiarFormulario()">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Lista de Productos -->
        <h3>Inventario Actual</h3>
        <div class="admin-list" id="admin-product-list">
            <!-- Cargado por JavaScript -->
        </div>
    </div>

    <script>
        let editandoId = null;

        function cargarProductosAdmin() {
            fetch('/api/productos')
                .then(res => res.json())
                .then(productos => {
                    const lista = document.getElementById('admin-product-list');
                    lista.innerHTML = '';

                    if (productos.length === 0) {
                        lista.innerHTML = `<p style="color: var(--text-muted); text-align: center;">No hay productos registrados.</p>`;
                        return;
                    }

                    productos.forEach(prod => {
                        const div = document.createElement('div');
                        div.className = 'admin-item';
                        div.innerHTML = `
                            <div class="admin-item-info">
                                <img src="${prod.imagen}" alt="${prod.nombre}" onerror="this.src='https://via.placeholder.com/50?text=Img'">
                                <div class="admin-item-details">
                                    <h4>${prod.nombre}</h4>
                                    <span>${prod.precio.toFixed(2)} Bs</span>
                                </div>
                            </div>
                            <div class="admin-actions">
                                <button class="btn-edit" onclick='prepararEdicion(${JSON.stringify(prod)})'>✏️ Editar</button>
                                <button class="btn-delete" onclick='eliminarProducto(${prod.id})'>🗑️ Eliminar</button>
                            </div>
                        `;
                        lista.appendChild(div);
                    });
                });
        }

        function guardarProducto(event) {
            event.preventDefault();

            const productoData = {
                nombre: document.getElementById('nombre').value,
                precio: parseFloat(document.getElementById('precio').value),
                imagen: document.getElementById('imagen').value,
                descripcion: document.getElementById('descripcion').value
            };

            const url = editandoId ? `/api/productos/${editandoId}` : '/api/productos';
            const method = editandoId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(productoData)
            })
            .then(res => res.json())
            .then(() => {
                limpiarFormulario();
                cargarProductosAdmin();
            })
            .catch(err => console.error('Error al guardar:', err));
        }

        function prepararEdicion(prod) {
            editandoId = prod.id;
            document.getElementById('product-id').value = prod.id;
            document.getElementById('nombre').value = prod.nombre;
            document.getElementById('precio').value = prod.precio;
            document.getElementById('imagen').value = prod.imagen;
            document.getElementById('descripcion').value = prod.descripcion;

            document.getElementById('form-title').innerText = `Editando: ${prod.nombre}`;
            document.getElementById('btn-submit-text').innerText = 'Actualizar Cambios';
            document.getElementById('btn-cancel').classList.add('show');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function limpiarFormulario() {
            editandoId = null;
            document.getElementById('product-form').reset();
            document.getElementById('product-id').value = '';
            document.getElementById('form-title').innerText = 'Agregar Nuevo Producto';
            document.getElementById('btn-submit-text').innerText = 'Guardar Producto';
            document.getElementById('btn-cancel').classList.remove('show');
        }

        function eliminarProducto(id) {
            if (confirm('¿Estás seguro de eliminar este producto?')) {
                fetch(`/api/productos/${id}`, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(() => cargarProductosAdmin())
                    .catch(err => console.error('Error al eliminar:', err));
            }
        }

        // Cargar inventario al abrir la página
        cargarProductosAdmin();
    </script>
</body>
</html>
