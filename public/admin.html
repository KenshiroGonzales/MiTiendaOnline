<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAPE LAB | Panel de Control</title>
    <style>
        :root {
            --bg-base: #08070b;
            --card-bg: #121019;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-yellow: #f39c12;
            --danger: #ff4757;
            --text-main: #ffffff;
            --text-muted: #a09ab0;
            --border-glow: rgba(0, 240, 255, 0.2);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(157, 0, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Cabecera */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .logo-area h1 {
            font-size: 24px;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo-area p {
            margin: 2px 0 0 0;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .btn-link {
            color: var(--neon-cyan);
            text-decoration: none;
            border: 1px solid var(--border-glow);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            background: rgba(0, 240, 255, 0.03);
        }

        .btn-link:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        /* Secciones del Panel */
        .panel-section {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 30px;
            margin-bottom: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .panel-section h2 {
            font-size: 20px;
            color: #fff;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Formulario */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            background-color: #0a080f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
        }

        .image-input-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Botones personalizados */
        .btn {
            background: linear-gradient(135deg, var(--neon-cyan), #0088ff);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn-file-sub {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            white-space: nowrap;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }

        .btn-file-sub:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--neon-cyan);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: none;
        }

        /* Tabla de Inventario Estilizada */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }

        img.thumb {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #000;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            padding: 7px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }

        .btn-edit {
            background-color: var(--neon-yellow);
            color: #000;
        }

        .btn-delete {
            background-color: var(--danger);
            color: #fff;
        }

        .btn-action:hover {
            opacity: 0.85;
        }

        .empty-row {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 30px !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabecera -->
        <header>
            <div class="logo-area">
                <h1>Vape Lab</h1>
                <p>Admin Dashboard</p>
            </div>
            <a href="/" class="btn-link" target="_blank">Ver Tienda en Vivo ↗</a>
        </header>

        <!-- Formulario de Producto -->
        <div class="panel-section">
            <h2 id="form-title">✨ Agregar Nuevo Producto</h2>
            <form id="product-form" onsubmit="guardarProducto(event)">
                <input type="hidden" id="prod-id">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="prod-nombre">Nombre del Producto</label>
                        <input type="text" id="prod-nombre" required placeholder="Ej. Elf Bar BC5000">
                    </div>
                    <div class="form-group">
                        <label for="prod-precio">Precio (Bs)</label>
                        <input type="number" step="0.01" id="prod-precio" required placeholder="Ej. 120.00">
                    </div>
                    <div class="form-group full">
                        <label for="prod-imagen">Imagen (URL o Subir archivo desde el equipo)</label>
                        <div class="image-input-container">
                            <input type="text" id="prod-imagen" required placeholder="https://... o selecciona un archivo local">
                            <input type="file" id="prod-file" accept="image/*" style="display: none;" onchange="procesarArchivoImagen(this)">
                            <button type="button" class="btn-file-sub" onclick="document.getElementById('prod-file').click()">📂 Buscar Archivo</button>
                        </div>
                    </div>
                    <div class="form-group full">
                        <label for="prod-descripcion">Descripción</label>
                        <textarea id="prod-descripcion" rows="3" required placeholder="Detalles, sabores o capacidad de caladas..."></textarea>
                    </div>
                </div>
                <div style="display: flex; gap: 12px; margin-top: 10px;">
                    <button type="submit" class="btn" id="btn-submit">Guardar Producto</button>
                    <button type="button" class="btn btn-secondary" style="display: none;" id="btn-cancelar" onclick="limpiarFormulario()">Cancelar Edición</button>
                </div>
            </form>
        </div>

        <!-- Inventario Actual -->
        <div class="panel-section">
            <h2>📦 Inventario Actual</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Descripción</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body">
                        <!-- Creado dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let editandoId = null;

        function cargarInventario() {
            fetch('/api/productos')
                .then(res => res.json())
                .then(productos => {
                    const tbody = document.getElementById('admin-table-body');
                    tbody.innerHTML = '';

                    if (productos.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" class="empty-row">No hay productos registrados actualmente.</td></tr>`;
                        return;
                    }

                    productos.forEach(prod => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><img src="${prod.imagen}" alt="${prod.nombre}" class="thumb" onerror="this.src='https://via.placeholder.com/50?text=Error'"></td>
                            <td><strong style="color: #fff;">${prod.nombre}</strong></td>
                            <td style="color: var(--neon-cyan); font-weight: 700;">${prod.precio.toFixed(2)} Bs</td>
                            <td style="color: var(--text-muted); max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${prod.descripcion}</td>
                            <td>
                                <div class="actions">
                                    <button class="btn-action btn-edit" onclick="cargarParaEditar(${prod.id}, '${escapeHtml(prod.nombre)}', ${prod.precio}, '${escapeHtml(prod.imagen)}', '${escapeHtml(prod.descripcion)}')">✏️ Editar</button>
                                    <button class="btn-action btn-delete" onclick="eliminarProducto(${prod.id})">🗑️ Borrar</button>
                                </div>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => console.error('Error al cargar inventario:', err));
        }

        function procesarArchivoImagen(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('prod-imagen').value = e.target.result;
                    alert('¡Imagen cargada y procesada desde tu equipo con éxito!');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function guardarProducto(event) {
            event.preventDefault();

            const nombre = document.getElementById('prod-nombre').value;
            const precio = parseFloat(document.getElementById('prod-precio').value);
            const imagen = document.getElementById('prod-imagen').value;
            const descripcion = document.getElementById('prod-descripcion').value;

            const datos = { nombre, precio, imagen, descripcion };

            const urlEndpoint = editandoId === null ? '/api/productos' : `/api/productos/${editandoId}`;
            const metodoHttp = editandoId === null ? 'POST' : 'PUT';

            fetch(urlEndpoint, {
                method: metodoHttp,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            })
            .then(async res => {
                if (!res.ok) throw new Error('Error al procesar la solicitud.');
                return res.json();
            })
            .then(() => {
                const mensaje = editandoId === null ? '¡Producto agregado con éxito!' : '¡Producto actualizado correctamente!';
                limpiarFormulario();
                cargarInventario();
                alert(mensaje);
            })
            .catch(err => alert('No se pudo guardar el producto.'));
        }

        function cargarParaEditar(id, nombre, precio, imagen, descripcion) {
            editandoId = id;
            document.getElementById('prod-id').value = id;
            document.getElementById('prod-nombre').value = nombre;
            document.getElementById('prod-precio').value = precio;
            document.getElementById('prod-imagen').value = imagen;
            document.getElementById('prod-descripcion').value = descripcion;

            document.getElementById('form-title').innerText = '🛠️ Modificar Producto (ID: ' + id + ')';
            document.getElementById('btn-submit').innerText = 'Actualizar Cambios';
            document.getElementById('btn-cancelar').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function eliminarProducto(id) {
            if (!confirm('¿Estás seguro de eliminar este producto del inventario?')) return;

            fetch(`/api/productos/${id}`, { method: 'DELETE' })
                .then(async res => {
                    if (!res.ok) throw new Error('Error al eliminar.');
                    return res.json();
                })
                .then(() => {
                    cargarInventario();
                    alert('Producto eliminado correctamente.');
                })
                .catch(err => alert('Error al intentar eliminar el producto.'));
        }

        function limpiarFormulario() {
            editandoId = null;
            document.getElementById('product-form').reset();
            document.getElementById('form-title').innerText = '✨ Agregar Nuevo Producto';
            document.getElementById('btn-submit').innerText = 'Guardar Producto';
            document.getElementById('btn-cancelar').style.display = 'none';
        }

        function escapeHtml(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        cargarInventario();
    </script>
</body>
</html>
